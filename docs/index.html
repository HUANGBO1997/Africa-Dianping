<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAUL Gombe — Menu</title><style>button,input,select{min-height:44px}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b77720;outline-offset:3px}nav{position:sticky;top:0;background:#f7f4ee;padding:10px 0;z-index:2}dialog::backdrop{background:#0008}@media(max-width:760px){main{padding:0 14px}.hero{padding:24px}.brand{font-size:32px}aside{margin-bottom:24px}nav input{width:100%}header span{font-size:12px}dialog input,dialog select{max-width:100%}}*{box-sizing:border-box}body{margin:0;background:#f7f4ee;color:#252923;font:15px system-ui}header{padding:22px 5%;background:#203b32;color:white;display:flex;justify-content:space-between;align-items:center}button,input,select{font:inherit;padding:10px;border:1px solid #ccc;border-radius:6px}button{cursor:pointer;background:#203b32;color:white}main{max-width:1200px;margin:32px auto;padding:0 24px}.hero{padding:42px;background:#e8ddc8;border-radius:12px}.brand{font:48px Georgia;margin:0}.muted{color:#72766e}.layout{display:grid;grid-template-columns:1fr 320px;gap:24px;margin-top:24px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card,aside{background:white;padding:22px;border:1px solid #e4e2db;border-radius:10px}nav{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}h3{margin-top:0}.price{font:24px Georgia}aside{align-self:start}table{width:100%;border-collapse:collapse;background:white}td,th{text-align:left;padding:16px;border-bottom:1px solid #eee}.tag{background:#e8ddc8;padding:5px 10px;border-radius:20px}dialog{border:0;border-radius:12px;max-width:420px;width:90%;padding:28px}label{display:block;margin:15px 0}footer{padding:30px;text-align:center;color:#777}@media(max-width:760px){.layout{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.brand{font-size:36px}header{gap:12px;flex-wrap:wrap}table{font-size:12px}td,th{padding:8px}}</style><header><b>PAUL LE CAFÉ · GOMBE</b><span>Démonstration · Prix indicatifs en USD</span><button onclick="admin=!admin;render()">Client / Gestion (démo)</button></header><main id="app"></main><dialog id="detail"></dialog><footer>Démonstration uniquement · Aucune commande transmise au restaurant · Paiement non connecté</footer><script>function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
let admin=false,category='Tout',query='',cart=[],orders=[],items=[{id:1,name:'Croissant au beurre',zh:'Croissant pur beurre',cat:'Boulangerie',price:4,stock:true},{id:2,name:'Cappuccino',zh:'Café et mousse de lait',cat:'Café',price:5,stock:true},{id:3,name:'Sandwich poulet',zh:'Sandwich au poulet',cat:'Sandwichs',price:12,stock:true},{id:4,name:'Tarte au citron',zh:'Pâtisserie au citron',cat:'Pâtisserie',price:7,stock:true}];const app=document.querySelector('#app'),dlg=document.querySelector('#detail');function total(){return cart.reduce((s,x)=>s+x.price*x.qty,0)}function render(){if(admin){app.innerHTML=`<h1>Gestion du restaurant</h1><p class="muted">Commandes de démonstration sur cet appareil uniquement.</p><div class="hero">Commandes <b>${orders.length}</b>　·　Montant USD ${orders.reduce((s,o)=>s+o.total,0).toFixed(2)}</div><h2>Suivi des commandes</h2><table><tr><th>Commande</th><th>Client / Service</th><th>Montant</th><th>État</th><th>Action</th></tr>${orders.map((o,i)=>`<tr><td>#${o.id}<br>${o.lines}</td><td>${o.name} / ${o.mode}</td><td>USD ${o.total.toFixed(2)}</td><td>${o.status}</td><td><button onclick="advance(${i})">Étape suivante</button></td></tr>`).join('')||'<tr><td colspan="5">Aucune commande de démonstration.</td></tr>'}</table><h2>Gestion du menu</h2><table>${items.map((x,i)=>`<tr><td>${x.name}</td><td>USD ${x.price}</td><td>${x.stock?'Disponible':'Épuisé'}</td><td><button onclick="items[${i}].stock=!items[${i}].stock;render()">Disponibilité</button> <button onclick="edit(${i})">Modifier le prix</button></td></tr>`).join('')}</table>`;return}app.innerHTML=`<div class="hero"><p>BOULANGERIE · CAFÉ · RESTAURANT</p><h1 class="brand">Un moment chez PAUL.</h1><p>Votre pause gourmande à Gombe. Sans inscription.</p><span class="tag">Gombe · Horaires à confirmer</span></div><nav>${['Tout','Boulangerie','Café','Sandwichs','Pâtisserie'].map(c=>`<button onclick="category='${c}';render()" style="opacity:${category===c?1:.55}">${c}</button>`).join('')}<input placeholder="Rechercher un produit…" value="${escapeHtml(query)}" oninput="query=this.value;drawCards()"></nav><div class="layout"><section class="cards" id="cards"></section><aside><h2>Votre panier</h2>${cart.map((x,i)=>`<p>${x.name} · ${x.option}<br><button onclick="cart[${i}].qty--;cart=cart.filter(x=>x.qty>0);render()">−</button> ${x.qty} <button onclick="cart[${i}].qty++;render()">＋</button> USD ${(x.qty*x.price).toFixed(2)}</p>`).join('')||'<p class="muted">Votre panier est vide.</p>'}<hr><h3>Total USD ${total().toFixed(2)}</h3><button onclick="checkout()">Vérifier la commande</button></aside></div>`;drawCards()}function drawCards(){document.querySelector('#cards').innerHTML=items.filter(x=>(category==='Tout'||x.cat===category)&&(x.name+x.zh).toLowerCase().includes(query.toLowerCase())).map(x=>`<article class="card"><p class="muted">${x.cat}</p><h3>${x.name}</h3><p>${x.zh}</p><p class="price">USD ${x.price.toFixed(2)}</p><button ${x.stock?'':'disabled'} onclick="choose(${x.id})">${x.stock?'Choisir ＋':'暂时Épuisé'}</button></article>`).join('')||'<p>Aucun produit trouvé</p>'}function choose(id){let x=items.find(x=>x.id===id);dlg.innerHTML=`<h2>${x.name}</h2><label>Format <select id="size"><option value="0">Classique</option><option value="2">Grand +2 USD</option></select></label><label><input type="checkbox" id="extra"> Supplément +1 USD</label><button onclick="add(${id})">Ajouter au panier</button> <button onclick="dlg.close()">Annuler</button>`;dlg.showModal()}function add(id){let x=items.find(x=>x.id===id),s=+document.querySelector('#size').value,e=document.querySelector('#extra').checked;cart.push({...x,price:x.price+s+(e?1:0),qty:1,option:(s?'Grand':'Classique')+(e?' Supplément':'')});dlg.close();render()}function checkout(){if(!cart.length)return alert('Ajoutez un produit au panier');dlg.innerHTML='<h2>Vérifier la commande</h2><form onsubmit="submitOrder(event)"><label>Prénom <input id="name" required maxlength="40"></label><label>Service <select id="mode"><option>Sur place</option><option>À emporter</option></select></label><p>Paiement sur place · Aucun paiement en ligne. Aucun frais supplémentaire dans cette démo.</p><p>Total $'+total().toFixed(2)+'</p><button>Simuler la commande</button> <button type="button" onclick="dlg.close()">Annuler</button></form>';dlg.showModal()}function submitOrder(e){e.preventDefault();let name=document.querySelector('#name').value;orders.push({id:1001+orders.length,name:name.replace(/[<>]/g,''),mode:document.querySelector('#mode').value,total:total(),lines:cart.map(x=>x.name+' ×'+x.qty).join('、'),status:'À confirmer'});cart=[];dlg.close();render();alert('Simulation enregistrée sur cet appareil. Aucune commande envoyée au restaurant.')}function advance(i){let states=['À confirmer','En préparation','Prête','Terminée'];orders[i].status=states[Math.min(states.indexOf(orders[i].status)+1,3)];render()}function edit(i){let v=prompt('Nouveau prix en USD',items[i].price);if(v!==null&&v.trim()!==''&&Number.isFinite(+v)&&+v>=0){items[i].price=+v;render()}}render();</script></html>
