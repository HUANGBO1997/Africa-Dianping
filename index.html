<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>餐厅双端产品原型</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f4ee;color:#252923;font:15px system-ui}header{padding:22px 5%;background:#203b32;color:white;display:flex;justify-content:space-between;align-items:center}button,input,select{font:inherit;padding:10px;border:1px solid #ccc;border-radius:6px}button{cursor:pointer;background:#203b32;color:white}main{max-width:1200px;margin:32px auto;padding:0 24px}.hero{padding:42px;background:#e8ddc8;border-radius:12px}.brand{font:48px Georgia;margin:0}.muted{color:#72766e}.layout{display:grid;grid-template-columns:1fr 320px;gap:24px;margin-top:24px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card,aside{background:white;padding:22px;border:1px solid #e4e2db;border-radius:10px}nav{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}h3{margin-top:0}.price{font:24px Georgia}aside{align-self:start}table{width:100%;border-collapse:collapse;background:white}td,th{text-align:left;padding:16px;border-bottom:1px solid #eee}.tag{background:#e8ddc8;padding:5px 10px;border-radius:20px}dialog{border:0;border-radius:12px;max-width:420px;width:90%;padding:28px}label{display:block;margin:15px 0}footer{padding:30px;text-align:center;color:#777}@media(max-width:760px){.layout{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.brand{font-size:36px}header{gap:12px;flex-wrap:wrap}table{font-size:12px}td,th{padding:8px}}</style><header><b>PAUL LE CAFÉ · GOMBE</b><span>产品流程原型 · 示例菜品 / 价格</span><button onclick="admin=!admin;render()">切换客户端 / 管理端</button></header><main id="app"></main><dialog id="detail"></dialog><footer>本地内存演示 · 刷新重置 · 无真实支付与后端 · 视觉待原站核验</footer><script>
let admin=false,category='全部',query='',cart=[],orders=[],items=[{id:1,name:'Croissant au beurre',zh:'黄油可颂',cat:'烘焙',price:4,stock:true},{id:2,name:'Cappuccino',zh:'卡布奇诺',cat:'咖啡',price:5,stock:true},{id:3,name:'Sandwich poulet',zh:'鸡肉三明治',cat:'轻食',price:12,stock:true},{id:4,name:'Tarte au citron',zh:'柠檬挞',cat:'甜点',price:7,stock:true}];const app=document.querySelector('#app'),dlg=document.querySelector('#detail');function total(){return cart.reduce((s,x)=>s+x.price*x.qty,0)}function render(){if(admin){app.innerHTML=`<h1>门店工作台</h1><p class="muted">演示：客户端下单后，订单会同步出现在此处。</p><div class="hero">今日订单 <b>${orders.length}</b>　·　订单金额 $${orders.reduce((s,o)=>s+o.total,0).toFixed(2)}</div><h2>订单处理</h2><table><tr><th>订单</th><th>顾客 / 场景</th><th>金额</th><th>状态</th><th>操作</th></tr>${orders.map((o,i)=>`<tr><td>#${o.id}<br>${o.lines}</td><td>${o.name} / ${o.mode}</td><td>$${o.total.toFixed(2)}</td><td>${o.status}</td><td><button onclick="advance(${i})">推进状态</button></td></tr>`).join('')||'<tr><td colspan="5">暂无订单，请切回客户端提交示例订单。</td></tr>'}</table><h2>商品管理</h2><table>${items.map((x,i)=>`<tr><td>${x.name}</td><td>$${x.price}</td><td>${x.stock?'在售':'售罄'}</td><td><button onclick="items[${i}].stock=!items[${i}].stock;render()">切换售罄</button> <button onclick="edit(${i})">修改价格</button></td></tr>`).join('')}</table>`;return}app.innerHTML=`<div class="hero"><p>BOULANGERIE · CAFÉ · RESTAURANT</p><h1 class="brand">Un moment chez PAUL.</h1><p>浏览菜单，享受片刻美好。</p><span class="tag">Gombe · 示例营业状态</span></div><nav>${['全部','烘焙','咖啡','轻食','甜点'].map(c=>`<button onclick="category='${c}';render()" style="opacity:${category===c?1:.55}">${c}</button>`).join('')}<input placeholder="搜索菜品…" value="${query}" oninput="query=this.value;drawCards()"></nav><div class="layout"><section class="cards" id="cards"></section><aside><h2>您的购物车</h2>${cart.map((x,i)=>`<p>${x.name} · ${x.option}<br><button onclick="cart[${i}].qty--;cart=cart.filter(x=>x.qty>0);render()">−</button> ${x.qty} <button onclick="cart[${i}].qty++;render()">＋</button> $${(x.qty*x.price).toFixed(2)}</p>`).join('')||'<p class="muted">选择喜欢的菜品开始点单</p>'}<hr><h3>合计 $${total().toFixed(2)}</h3><button onclick="checkout()">确认订单</button></aside></div>`;drawCards()}function drawCards(){document.querySelector('#cards').innerHTML=items.filter(x=>(category==='全部'||x.cat===category)&&(x.name+x.zh).toLowerCase().includes(query.toLowerCase())).map(x=>`<article class="card"><p class="muted">${x.cat}</p><h3>${x.name}</h3><p>${x.zh}</p><p class="price">$${x.price.toFixed(2)}</p><button ${x.stock?'':'disabled'} onclick="choose(${x.id})">${x.stock?'选择规格 ＋':'暂时售罄'}</button></article>`).join('')||'<p>没有找到菜品</p>'}function choose(id){let x=items.find(x=>x.id===id);dlg.innerHTML=`<h2>${x.name}</h2><label>规格 <select id="size"><option value="0">标准</option><option value="2">大份 +$2</option></select></label><label><input type="checkbox" id="extra"> 加料 +$1</label><button onclick="add(${id})">加入购物车</button> <button onclick="dlg.close()">取消</button>`;dlg.showModal()}function add(id){let x=items.find(x=>x.id===id),s=+document.querySelector('#size').value,e=document.querySelector('#extra').checked;cart.push({...x,price:x.price+s+(e?1:0),qty:1,option:(s?'大份':'标准')+(e?' 加料':'')});dlg.close();render()}function checkout(){if(!cart.length)return alert('请先选择菜品');dlg.innerHTML='<h2>确认订单</h2><form onsubmit="submitOrder(event)"><label>姓名 <input id="name" required maxlength="40"></label><label>用餐方式 <select id="mode"><option>堂食</option><option>自取</option></select></label><p>支付：到店支付（演示）</p><p>合计 $'+total().toFixed(2)+'</p><button>提交模拟订单</button> <button type="button" onclick="dlg.close()">取消</button></form>';dlg.showModal()}function submitOrder(e){e.preventDefault();let name=document.querySelector('#name').value;orders.push({id:1001+orders.length,name:name.replace(/[<>]/g,''),mode:document.querySelector('#mode').value,total:total(),lines:cart.map(x=>x.name+' ×'+x.qty).join('、'),status:'待接单'});cart=[];dlg.close();render();alert('模拟订单已提交，可切换管理端处理。')}function advance(i){let states=['待接单','制作中','待取餐','已完成'];orders[i].status=states[Math.min(states.indexOf(orders[i].status)+1,3)];render()}function edit(i){let v=prompt('输入新价格',items[i].price);if(v!==null&&v.trim()!==''&&Number.isFinite(+v)&&+v>=0){items[i].price=+v;render()}}render();</script></html>
